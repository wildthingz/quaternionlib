name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    # Use a standard Ubuntu image that supports modern C++ and Python
    container: ubuntu:22.04
    env:
      # Prevent interactive prompts during apt install
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      # 1. Install System Dependencies
      #    We need cmake, compiler (build-essential), python, and git
      - name: Install system dependencies
        run: |
          apt-get update -q
          apt-get install -y build-essential cmake python3 python3-pip python3-venv git

      # 2. Set up Python Environment (Virtual Environment)
      #    Using a venv is best practice to avoid conflicts with system packages
      - name: Set up Python environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install pytest numpy scipy
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # 3. Configure CMake
      #    FetchContent will automatically download Eigen, GTest, Pybind11 here
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # 4. Build the Project
      - run: cmake --build build --config Release

      # 5. Run Tests
      #    CTest will run the GoogleTests (C++) and the Python scripts
      - run: ctest --output-on-failure
        working-directory: build
